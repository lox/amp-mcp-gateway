agents:
  queue: default

# Attach the hosted volume used automatically by setup-go and mise.
cache: ".buildkite/cache-volume"

steps:
  - label: ":go: Test and build"
    key: check
    plugins:
      - setup-go#v0.1.0: ~
      - mise#v1.1.5:
          install_args: node
    command: .buildkite/check
    timeout_in_minutes: 15

  - label: ":bun: Test Amp plugin"
    key: check-plugin
    plugins:
      - mise#v1.1.5:
          install_args: bun
    command: MISE_TASK_RUN_AUTO_INSTALL=false mise run check-plugin
    timeout_in_minutes: 5

  - label: ":docker: Build deployment image"
    key: build-image
    if: build.branch == "main" && build.pull_request.id == null
    plugins:
      - mise#v1.1.5:
          install_args: flyctl
    command: .buildkite/build-image
    timeout_in_minutes: 15

  - label: ":fly: Deploy main"
    key: deploy
    depends_on: [check, check-plugin, build-image]
    if: build.branch == "main" && build.pull_request.id == null
    plugins:
      - mise#v1.1.5:
          install_args: flyctl
    command: .buildkite/deploy
    concurrency: 1
    concurrency_group: lox-mcp-gateway-production
    timeout_in_minutes: 20
