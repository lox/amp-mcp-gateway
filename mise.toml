[tools]
go = "1.26.8"
node = "22.20.0"
flyctl = "0.4.104"
bun = "1.3.10"

[tasks.dev]
description = "Run disposable local demo (browser password: demo-only)"
depends = ["css"]
run = "go run ./cmd/mcp-gateway -demo"

[tasks.css]
description = "Build embedded Tailwind CSS with the locked CLI"
run = "npm ci --ignore-scripts --no-audit --no-fund && npm run build:css"

[tasks.check]
description = "Format, test and vet Go and browser JavaScript"
depends = ["css"]
run = "test -z \"$(gofmt -l cmd internal)\" && go test -race ./... && go vet ./... && node --check internal/gateway/assets/live.js && node --check internal/gateway/assets/notifications.js && node --check extension/background.js && node --check extension/popup.js && node --check extension/options.js && node --test extension/background.test.js tests/live.test.js tests/gateway/*.test.js"

[tasks.build]
depends = ["css"]
run = "go build -o bin/mcp-gateway ./cmd/mcp-gateway"

[tasks.check-plugin]
description = "Test the Amp approval preview plugin"
run = "bun test tests/plugins"
