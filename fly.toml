# Single-owner gateway. Configure Google login and Amp identity before deployment.
app = "lox-mcp-gateway"
primary_region = "syd"
kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "-config /etc/gateway.json"

[[files]]
  guest_path = "/etc/gateway.json"
  secret_name = "GATEWAY_CONFIG"

[http_service]
  processes = ["app"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  method = "GET"
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"

[[mounts]]
  source = "gateway_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"

# No replicas: one process owns the SQLite volume. Use fly deploy --ha=false.
